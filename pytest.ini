[pytest]
# Configuração pytest para o projeto ETL Statistics

# Diretório de testes
testpaths = tests

# Padrão de arquivos de teste
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Mostra linhas do código nos tracebacks
addopts = -v --tb=short --strict-markers

# Marcadores customizados
markers =
    asyncio: marca testes como asyncio (deselect with '-m "not asyncio"')
    integration: marca testes de integração
    unit: marca testes unitários

# Mostrar warnings
filterwarnings =
    error
    ignore::DeprecationWarning
